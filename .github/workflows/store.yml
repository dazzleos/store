# Makes the store's catalogue (scripts/make) every hour, and on each push
# to the default branch: the apps of dazzleos' app repositories, each from
# its build's release, signed with the key Dazzle's builds trust. If it
# has changed, it is published as the "latest" release's apps.json, which
# Dazzle's catalogue lists as a source.
name: Store

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-${{ github.ref }}

jobs:
  store:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Test
        run: zig build test --summary new

      - name: Make the catalogue
        if: github.event_name != 'pull_request'
        env:
          DAZZLE_SIGNING_KEY: ${{ secrets.DAZZLE_SIGNING_KEY }}
        run: scripts/make

      - name: Publish it, if it has changed
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view latest > /dev/null 2>&1; then
            gh release download latest -p apps.json -O published.json || true
            if cmp -s published.json zig-out/store/apps.json; then
              echo "Unchanged"
              exit 0
            fi
            gh release upload latest zig-out/store/apps.json --clobber
          else
            gh release create latest zig-out/store/apps.json \
              --target "$GITHUB_SHA" --title "The store" --latest \
              --notes "The catalogue of the apps Dazzle's Settings installs (Software): each listed from its repository's build, which its files are downloaded from."
          fi
          jq -r '.apps[] | "\(.name) \(.version) \(.base)"' zig-out/store/apps.json
